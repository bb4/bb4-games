name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  repository_dispatch:
    types: [ upstream-updated ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and test
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            ./gradlew clean build --refresh-dependencies
          else
            ./gradlew build
          fi

      - name: Publish SNAPSHOT
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        # Single-threaded publish plus build.gradle's inter-publication delay (default
        # 20s) so jarMap uploads stay under Central's rate limit. Keep a modest
        # Gradle HTTP retry for mid-publication 429s; do not crank retries hard —
        # Sonatype says that makes blocks worse.
        run: >
          ./gradlew publish --max-workers=1 --no-parallel
          -Dorg.gradle.internal.network.retry.max.attempts=4
          -Dorg.gradle.internal.network.retry.initial.backOff=8000
          -Dorg.gradle.internal.publish.checksums.insecure=true
